<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceX Mission Control</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; user-select: none; }
body { 
    background: #000; 
    color: #fff; 
    overflow: hidden; 
    height: 100vh; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    transition: background 0.2s;
}

#game-wrap {
    text-align: center;
    z-index: 10;
    transition: transform 0.1s;
}

h1 { color: #fff; font-size: 24px; margin-bottom: 20px; letter-spacing: 2px; }
p { color: #888; font-size: 12px; margin-bottom: 40px; }

#rocket {
    font-size: 120px;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));
}

#rocket:hover { filter: drop-shadow(0 0 30px rgba(255,255,255,0.5)); }

/* The Popups */
.popup {
    position: absolute;
    background: #222;
    border: 2px solid #ff0000;
    color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    font-family: 'Segoe UI', sans-serif;
    z-index: 100;
    animation: popIn 0.1s ease-out;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}
.popup h2 { color: #ff0000; font-size: 18px; margin-bottom: 10px; }
.popup p { color: #ccc; font-size: 13px; margin-bottom: 0; }
.popup .ip { font-family: monospace; color: #00ff00; font-size: 16px; margin-top: 5px; font-weight: bold; }

@keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* The Shake */
.shake {
    animation: shake 0.2s infinite;
}
@keyframes shake {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    10% { transform: translate(-1px, -2px) rotate(-1deg); }
    20% { transform: translate(-3px, 0px) rotate(1deg); }
    30% { transform: translate(3px, 2px) rotate(0deg); }
    40% { transform: translate(1px, -1px) rotate(1deg); }
    50% { transform: translate(-1px, 2px) rotate(-1deg); }
    60% { transform: translate(-3px, 1px) rotate(0deg); }
    70% { transform: translate(3px, 1px) rotate(-1deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    90% { transform: translate(1px, 2px) rotate(0deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
}
</style>
</head>
<body>

<div id="game-wrap">
    <h1>MISSION CONTROL</h1>
    <p>Click the rocket 5 times to initiate launch sequence.</p>
    <div id="rocket">🚀</div>
</div>

<script>
let clicks = 0;
let userIP = "Unknown";
let audioCtx = null;
let sirenInterval = null;

// Fetch their IP silently in the background
fetch('https://api.ipify.org?format=json')
    .then(r => r.json())
    .then(d => userIP = d.ip)
    .catch(() => userIP = "Hidden");

const rocket = document.getElementById('rocket');

rocket.addEventListener('click', () => {
    // Unlock audio context on first click (required by browsers)
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    clicks++;

    if (clicks < 5) {
        // Scale up slightly and shake
        rocket.style.transform = `scale(${1 + clicks * 0.15})`;
        rocket.classList.add('shake');
        setTimeout(() => rocket.classList.remove('shake'), 200);
        
        // Fake beep
        playBeep(400 + (clicks * 100), 0.1);
    } 
    else if (clicks === 5) {
        triggerPrank();
    }
});

function playBeep(freq, duration) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function triggerPrank() {
    // 1. Hide the rocket
    document.getElementById('game-wrap').style.display = 'none';
    
    // 2. Shake the screen violently
    document.body.classList.add('shake');
    document.body.style.background = '#200'; // dark red
    
    // 3. Play a loud continuous siren
    playSiren();

    // 4. Spawn fake virus popups infinitely
    setInterval(spawnPopup, 300);
    
    // Spawn a few immediately
    for(let i=0; i<5; i++) spawnPopup();
}

function playSiren() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    
    // Siren effect (sweep frequency up and down)
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.5);
    osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 1);
    
    gain.gain.value = 0.15; // Volume
    
    osc.start();
    
    // Loop the siren forever
    sirenInterval = setInterval(() => {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.5);
        osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 1);
    }, 1000);
}

function spawnPopup() {
    const popup = document.createElement('div');
    popup.className = 'popup';
    
    // Random positions all over the screen
    const x = Math.random() * (window.innerWidth - 300);
    const y = Math.random() * (window.innerHeight - 150);
    popup.style.left = `${x}px`;
    popup.style.top = `${y}px`;

    // Random fake error titles
    const titles = [
        "CRITICAL ERROR",
        "VIRUS DETECTED",
        "SYSTEM COMPROMISED",
        "IP LOGGED",
        "UNAUTHORIZED ACCESS"
    ];
    
    // Pick a random title
    const title = titles[Math.floor(Math.random() * titles.length)];

    popup.innerHTML = `
        <h2>⚠️ ${title}</h2>
        <p>Target IP Address:</p>
        <div class="ip">${userIP}</div>
        <p style="font-size:10px; margin-top:10px; color:#666;">Do not close this window.</p>
    `;

    document.body.appendChild(popup);

    // Optional: Remove them after 10 seconds so they don't lag the browser forever
    setTimeout(() => {
        if(popup.parentNode) popup.parentNode.removeChild(popup);
    }, 10000);
}
</script>

</body>
</html>
