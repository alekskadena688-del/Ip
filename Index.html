<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBX & V-Bucks Generator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    background: #1a1a1a; 
    color: #fff; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    overflow: hidden;
}
.card { 
    background: #232323; 
    padding: 40px; 
    border-radius: 12px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
    width: 100%; 
    max-width: 400px; 
    text-align: center;
    border: 1px solid #333;
}
h1 { color: #00b06f; margin-bottom: 10px; font-size: 24px; text-transform: uppercase; }
p.sub { color: #888; font-size: 13px; margin-bottom: 30px; }
.input-group { margin-bottom: 15px; text-align: left; }
label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; font-weight: bold; }
input { 
    width: 100%; 
    padding: 12px; 
    background: #111; 
    border: 1px solid #444; 
    border-radius: 6px; 
    color: #fff; 
    font-size: 16px; 
    outline: none;
}
input:focus { border-color: #00b06f; }
.btn { 
    width: 100%; 
    padding: 14px; 
    background: #00b06f; 
    border: none; 
    border-radius: 6px; 
    color: #fff; 
    font-size: 16px; 
    font-weight: bold; 
    cursor: pointer; 
    margin-top: 10px;
    transition: 0.2s;
}
.btn:hover { background: #00995f; }
.btn:active { transform: scale(0.98); }
.footer { margin-top: 20px; font-size: 10px; color: #555; }
</style>
</head>

    <div class="footer">Powered by Timmy Tih Generator v4.0</div>
</div>
