<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathew & Mya (Credits to Timmy Tih) — Wedding</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: #05050f;
    background-image: radial-gradient(circle at center, #10142e 0%, #05050f 100%);
    color: #fff;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    height: 100vh;
}

/* Stars Background */
.stars {
    position: absolute;
    inset: 0;
    background-image: 
        radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #fff, rgba(0,0,0,0));
    background-repeat: repeat;
    background-size: 200px 200px;
    opacity: 0.3;
    animation: twinkle 4s infinite alternate;
    z-index: 0;
}
@keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 0.6; } }

/* Floating Rockets */
#rocket-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

.rocket-img {
    position: absolute;
    width: 150px;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    border: 1px solid rgba(255,255,255,0.1);
    opacity: 0;
    animation: floatRocket linear infinite;
}

@keyframes floatRocket {
    0% { transform: translateY(110vh) translateX(0) rotate(15deg); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-20vh) translateX(100px) rotate(25deg); opacity: 0; }
}

/* Main Content */
.container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    backdrop-filter: blur(4px);
    background: rgba(5,5,15,0.4);
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 400;
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
}

h1 span {
    font-style: italic;
    color: #a78bfa;
    font-size: 0.8em;
    margin: 0 15px;
}

h2 {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1rem, 2vw, 1.5rem);
    font-weight: 300;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #e2e8f0;
    margin-bottom: 40px;
}

.divider {
    width: 100px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #a78bfa, transparent);
    margin-bottom: 40px;
}

.details {
    display: flex;
    gap: 40px;
    font-size: 1rem;
    color: #94a3b8;
    margin-bottom: 50px;
}

.details div { display: flex; flex-direction: column; gap: 5px; }
.details strong { color: #fff; font-weight: 600; font-size: 1.1rem; }

.rsvp-btn {
    padding: 15px 40px;
    background: transparent;
    border: 1px solid #a78bfa;
    color: #a78bfa;
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    border-radius: 4px;
}

.rsvp-btn:hover {
    background: #a78bfa;
    color: #05050f;
    box-shadow: 0 0 30px rgba(167,139,250,0.4);
}

@media (max-width: 600px) {
    .details { flex-direction: column; gap: 20px; }
    h1 { font-size: 3rem; }
}
</style>
</head>
<body>

<div class="stars"></div>
<div id="rocket-layer"></div>

<div class="container">
    <h1>Mathew <span>&</span> Mya</h1>
    <h2>Are Getting Married</h2>
    
    <div class="divider"></div>
    
    <div class="details">
        <div>
            <span>Date</span>
            <strong>October 24, 2026</strong>
        </div>
        <div>
            <span>Location</span>
            <strong>Launchpad 39A</strong>
        </div>
        <div>
            <span>Attire</span>
            <strong>Astro-Formal</strong>
        </div>
    </div>

    <button class="rsvp-btn" onclick="alert('RSVP Closed — See you at the launch!')">RSVP Now</button>
</div>

<script>
// Actual high-res rocket images (SpaceX / NASA)
const rocketImages = [
    "https://images.unsplash.com/photo-1541185933-ef5d8ed016c2?auto=format&fit=crop&w=300&q=80", // SpaceX Launch
    "https://images.unsplash.com/photo-1517976487492-5750f3195933?auto=format&fit=crop&w=300&q=80", // Astronaut/Rocket
    "https://images.unsplash.com/photo-1516849841032-87cbac4d88f7?auto=format&fit=crop&w=300&q=80", // Rocket Engine
    "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=300&q=80"  // Earth from space
];

const layer = document.getElementById('rocket-layer');

function spawnRocket() {
    // Create image element
    const img = document.createElement('img');
    img.className = 'rocket-img';
    
    // Pick random image
    img.src = rocketImages[Math.floor(Math.random() * rocketImages.length)];
    
    // Randomize horizontal start position
    img.style.left = `${Math.random() * 80}vw`;
    
    // Randomize animation duration (how fast it floats up)
    const duration = 8 + Math.random() * 7; 
    img.style.animationDuration = `${duration}s`;
    
    // Randomize size slightly
    const scale = 0.6 + Math.random() * 0.8;
    img.style.width = `${150 * scale}px`;

    // Add to DOM
    layer.appendChild(img);

    // Remove element after animation finishes to prevent lag
    setTimeout(() => {
        if (img.parentNode) {
            img.parentNode.removeChild(img);
        }
    }, duration * 1000);
}

// Spawn a new rocket every 1.5 seconds
setInterval(spawnRocket, 1500);

// Spawn a few immediately on load
for(let i=0; i<3; i++) {
    setTimeout(spawnRocket, i * 500);
}
</script>

</body>
</html>
